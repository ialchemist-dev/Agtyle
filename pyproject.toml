[project]
name = "agtyle"
version = "0.1.0"
description = "Agtyle reference implementation: an auditable agent execution spine."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0.35,<3",
    "alembic>=1.13,<2",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "hypothesis>=6.112,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "coverage>=7.6,<8",
    "types-pyyaml>=6,<7",
    "types-jsonschema>=4,<5",
    "httpx>=0.27,<1",
]

[project.scripts]
agtyle = "agtyle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agtyle"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "ASYNC240"]
"scripts/**" = ["S"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agtyle"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_agent: tests that require a live LLM runtime; excluded from default CI",
]
filterwarnings = ["error::DeprecationWarning:agtyle.*"]

[tool.coverage.run]
branch = true
source = ["src/agtyle"]
omit = ["src/agtyle/cli.py", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
