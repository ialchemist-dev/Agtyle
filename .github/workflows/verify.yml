name: verify

# The deterministic gate runs on Linux and macOS because the intended personal runtime is macOS
# and CI is Linux. The clean-clone acceptance runs on Linux only, since it is the slowest job and
# proves the same thing on either host.

on:
  push:
    branches: ["main", "implement/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bootstrap dependencies and the pinned Cedar CLI
        run: make bootstrap

      - name: Initialize
        run: make init

      - name: Verify
        run: make verify

      - name: Live multi-process reminder demonstration
        run: make demo-reminder

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: artifacts/verification/
          if-no-files-found: warn

  clean-clone:
    name: clean-clone acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Clone at HEAD into a temporary directory and verify there
        run: uv run python scripts/clean_clone_verify.py
